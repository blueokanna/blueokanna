    <path d="M730 194 H1120" stroke="#16243c" stroke-width="1"/>

    <g font-size="10" letter-spacing="2" text-anchor="middle">
      <rect x="730" y="212" width="126" height="52" rx="10" fill="#0a1322" stroke="#16243c" stroke-width="1"/>
      <text x="793" y="238" fill="#22d3ee" font-size="16" letter-spacing="1">∞</text>
      <text x="793" y="256" fill="#3f5876">REPOS</text>

      <rect x="868" y="212" width="126" height="52" rx="10" fill="#0a1322" stroke="#16243c" stroke-width="1"/>
      <text x="931" y="238" fill="#818cf8" font-size="16" letter-spacing="1">12</text>
      <text x="931" y="256" fill="#3f5876">STACK</text>

      <rect x="1006" y="212" width="126" height="52" rx="10" fill="#0a1322" stroke="#16243c" stroke-width="1"/>
      <text x="1069" y="238" fill="#f472b6" font-size="16" letter-spacing="1">99.9%</text>
      <text x="1069" y="256" fill="#3f5876">UPTIME</text>
    </g>

    <path d="M730 284 H1120" stroke="#16243c" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M730 284 H1120" stroke="url(#aflow)" stroke-width="2" stroke-linecap="round" stroke-dasharray="120 1400">
      <animate attributeName="stroke-dashoffset" values="0;-1520" dur="7s" repeatCount="indefinite"/>
    </path>
    <circle cx="1128" cy="284" r="3" fill="#f9a8d4">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="12" y="12" width="1176" height="306" rx="18" fill="none" stroke="url(#aedge)" stroke-width="1.4" opacity="0.8"/>
  <g stroke="url(#aedge)" stroke-width="2" fill="none">
    <path d="M22 250 V300 Q22 304 26 304 H66"/>
    <path d="M1178 300 Q1178 304 1174 304 H1134 V250"/>
    <animate attributeName="opacity" values="0.85;0.3;0.85" dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
