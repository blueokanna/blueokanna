<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="whoami — identity and arsenal">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#130a1c"/>
    </linearGradient>
    <linearGradient id="aedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="apill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="aflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f9a8d4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ahalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="agrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 H0 V36" fill="none" stroke="#1b3a5e" stroke-width="1"/>
    </pattern>
    <clipPath id="aframe">
      <rect x="12" y="12" width="1176" height="306" rx="18"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="306" rx="18" fill="url(#abg)"/>
  <g clip-path="url(#aframe)">
    <rect x="-36" y="-36" width="1272" height="380" fill="url(#agrid)" opacity="0.22">
      <animateTransform attributeName="transform" type="translate" values="0 0;36 36" dur="13s" repeatCount="indefinite"/>
    </rect>
    <circle cx="120" cy="310" r="230" fill="url(#ahalo)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="10s" repeatCount="indefinite"/>
    </circle>

    <path d="M12 56 H1188" stroke="#16243c" stroke-width="1"/>
    <text class="mono" x="40" y="40" font-size="13" fill="#7c8a9d">profile · whoami --verbose</text>
    <text class="mono" x="700" y="40" font-size="12" fill="#3f5876">public data · read-only · no telemetry</text>
    <circle cx="1112" cy="35" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text class="mono" x="1124" y="40" font-size="12" fill="#34d399" letter-spacing="1">LIVE</text>

    <path d="M720 76 V300" stroke="#16243c" stroke-width="1" stroke-dasharray="5 7"/>
    <rect x="12" y="0" width="1176" height="2" fill="#22d3ee" opacity="0.22">
      <animate attributeName="y" values="12;318;12" dur="15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="mono">
    <text x="40" y="84" font-size="12" letter-spacing="3" fill="#3f5876">IDENTITY</text>
    <path d="M132 80 H700" stroke="#16243c" stroke-width="1"/>

    <g font-size="13">
      <g fill="#7c8a9d">
        <text x="40" y="122">user</text>
        <text x="40" y="156">role</text>
        <text x="40" y="190">stack</text>
        <text x="40" y="224">platform</text>
        <text x="40" y="258">mail</text>
        <text x="40" y="292">source</text>
      </g>
      <g fill="#22d3ee" fill-opacity="0.8">
        <text x="170" y="122">›</text>
        <text x="170" y="156">›</text>
        <text x="170" y="190">›</text>
        <text x="170" y="224">›</text>
        <text x="170" y="258">›</text>
        <text x="170" y="292">›</text>
      </g>
      <text x="192" y="122" fill="#c9d1d9" opacity="0">blueokanna
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.03;0.08;0.95;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="192" y="156" fill="#c9d1d9" opacity="0">backend engineer · systems &amp; performance
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.15;0.95;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="192" y="190" fill="#c9d1d9" opacity="0">rust · java · flutter · c / c++
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.17;0.22;0.95;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="192" y="224" fill="#c9d1d9" opacity="0">linux · windows · android
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.29;0.95;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="192" y="258" fill="#7dd3fc" opacity="0">blueokanna@gmail.com
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.31;0.36;0.95;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="192" y="292" fill="#f9a8d4" opacity="0">github.com/blueokanna
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.43;0.95;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.48;0.95;1" dur="15s" repeatCount="indefinite"/>
        <rect x="352" y="280" width="8" height="14" fill="#f9a8d4">
          <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <text x="748" y="84" font-size="12" letter-spacing="3" fill="#3f5876">ARSENAL</text>
    <path d="M852 80 H1156" stroke="#16243c" stroke-width="1"/>

    <g font-size="13" text-anchor="middle">
      <rect x="730" y="102" width="90" height="30" rx="8" fill="#0b1524" stroke="url(#apill)" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="775" y="122" fill="#c9d1d9">Rust</text>

      <rect x="832" y="102" width="90" height="30" rx="8" fill="#0b1524" stroke="url(#apill)" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="5s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <text x="877" y="122" fill="#c9d1d9">Java</text>

      <rect x="934" y="102" width="100" height="30" rx="8" fill="#0b1524" stroke="url(#apill)" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="5s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <text x="984" y="122" fill="#c9d1d9">C / C++</text>

      <rect x="1046" y="102" width="110" height="30" rx="8" fill="#0b1524" stroke="url(#apill)" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="1101" y="122" fill="#c9d1d9">Flutter</text>

      <rect x="730" y="144" width="96" height="30" rx="8" fill="#0b1524" stroke="url(#apill)" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="5s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <text x="778" y="164" fill="#c9d1d9">SQLite</text>

      <rect x="838" y="144" width="88" height="30" rx="8" fill="#0b1524" stroke="url(#apill)" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="5s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <text x="882" y="164" fill="#c9d1d9">Linux</text>

      <rect x="938" y="144" width="70" height="30" rx="8" fill="#0b1524" stroke="url(#apill)" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="5s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="973" y="164" fill="#c9d1d9">Git</text>

      <rect x="1020" y="144" width="78" height="30" rx="8" fill="#0b1524" stroke="url(#apill)" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="5s" begin="2.8s" repeatCount="indefinite"/>
      </rect>
      <text x="1059" y="164" fill="#c9d1d9">Kali</text>
