<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16243c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#16243c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <path d="M40 22 H560" stroke="url(#dline)" stroke-width="1.4"/>
  <path d="M640 22 H1160" stroke="url(#dline)" stroke-width="1.4"/>
  <path d="M40 22 H560" stroke="url(#dflow)" stroke-width="2" stroke-dasharray="90 1400" filter="url(#dglow)">
    <animate attributeName="stroke-dashoffset" values="0;-1490" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M640 22 H1160" stroke="url(#dflow)" stroke-width="2" stroke-dasharray="90 1400" filter="url(#dglow)">
    <animate attributeName="stroke-dashoffset" values="-1490;0" dur="5s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(600,22)">
    <path d="M0 -14 L12 0 L0 14 L-12 0 Z" fill="#0a1020" stroke="#22d3ee" stroke-width="1.4" filter="url(#dglow)">
      <animate attributeName="stroke" values="#22d3ee;#a855f7;#22d3ee" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle r="3.4" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="none" stroke="#22d3ee" stroke-width="1">
      <animate attributeName="r" values="12;26" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="none" stroke="#a855f7" stroke-width="1">
      <animate attributeName="r" values="12;26" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#22d3ee" opacity="0.75">
    <rect x="120" y="19" width="2" height="6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="300" y="19" width="2" height="6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="480" y="19" width="2" height="6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="720" y="19" width="2" height="6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="900" y="19" width="2" height="6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="1.6s" repeatCount="indefinite"/></rect>
    <rect x="1080" y="19" width="2" height="6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.2s" repeatCount="indefinite"/></rect>
  </g>
</svg>
