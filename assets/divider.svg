<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a475e" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#2a475e" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#66c0f4" stop-opacity="0.75"/>
      <stop offset="0.82" stop-color="#2a475e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2a475e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ad7ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9ad7ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#9ad7ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M60 20 H1140" stroke="url(#line)" stroke-width="1.4"/>
  <path d="M60 20 H1140" stroke="url(#flow)" stroke-width="2" stroke-dasharray="170 1400" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-1570" dur="6.5s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(600,20)">
    <path d="M-15 0 L-9 -9 H9 L15 0 L9 9 H-9 Z" fill="#0e1622" stroke="#66c0f4" stroke-width="1.4" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.95;0.45;0.95" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle r="3" fill="#9ad7ff">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="none" stroke="#66c0f4" stroke-width="1">
      <animate attributeName="r" values="13;28" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.65;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#66c0f4">
    <rect x="150" y="17" width="2" height="6" opacity="0.6"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="330" y="17" width="2" height="6" opacity="0.6"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="510" y="17" width="2" height="6" opacity="0.6"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="690" y="17" width="2" height="6" opacity="0.6"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="870" y="17" width="2" height="6" opacity="0.6"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></rect>
    <rect x="1050" y="17" width="2" height="6" opacity="0.6"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.4s" begin="2s" repeatCount="indefinite"/></rect>
  </g>
</svg>
