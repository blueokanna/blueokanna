<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="footer">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1b2838"/>
      <stop offset="1" stop-color="#131b26"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66c0f4"/>
      <stop offset="0.6" stop-color="#2a475e"/>
      <stop offset="1" stop-color="#57cbde"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a475e" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#66c0f4" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2a475e" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f9ff"/>
      <stop offset="0.55" stop-color="#9ad7ff"/>
      <stop offset="1" stop-color="#66c0f4"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fd4ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8fd4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#22384d" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>
    <clipPath id="frame">
      <rect x="12" y="12" width="1176" height="136" rx="14"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="136" rx="14" fill="url(#panel)"/>
  <g clip-path="url(#frame)">
    <rect x="-30" y="-30" width="1236" height="196" fill="url(#grid)" opacity="0.28">
      <animateTransform attributeName="transform" type="translate" values="0 0;30 0" dur="12s" repeatCount="indefinite"/>
    </rect>
    <circle cx="600" cy="150" r="230" fill="url(#bloom)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="9s" repeatCount="indefinite"/>
    </circle>

    <g fill="none" stroke="url(#wave)" stroke-width="1.3" opacity="0.5">
      <path d="M0 126 Q75 110 150 126 T300 126 T450 126 T600 126 T750 126 T900 126 T1050 126 T1200 126 T1350 126 T1500 126 T1650 126 T1800 126 T1950 126 T2100 126 T2250 126 T2400 126">
        <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="17s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="none" stroke="url(#wave)" stroke-width="1.7" opacity="0.8">
      <path d="M0 142 Q75 126 150 142 T300 142 T450 142 T600 142 T750 142 T900 142 T1050 142 T1200 142 T1350 142 T1500 142 T1650 142 T1800 142 T1950 142 T2100 142 T2250 142 T2400 142">
        <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="none" stroke="url(#wave)" stroke-width="2.2" opacity="0.9">
      <path d="M0 154 Q75 140 150 154 T300 154 T450 154 T600 154 T750 154 T900 154 T1050 154 T1200 154 T1350 154 T1500 154 T1650 154 T1800 154 T1950 154 T2100 154 T2250 154 T2400 154">
        <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <rect x="12" y="0" width="1176" height="2" fill="#66c0f4" opacity="0.25">
      <animate attributeName="y" values="12;148;12" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="mono" text-anchor="middle">
    <text x="600" y="58" font-size="18" font-weight="700" letter-spacing="2" fill="url(#title)">© 2026 BLUEOKANNA</text>
    <text x="600" y="82" font-size="12" fill="#8f98a0" letter-spacing="1">backend engineer · rust · java · flutter</text>
    <text x="600" y="103" font-size="11" fill="#66c0f4" fill-opacity="0.8" letter-spacing="3">HANAYOME EDITION · 花嫁</text>
  </g>

  <g class="mono" font-size="11">
    <text x="88" y="38" fill="#4d6a85">// end of transmission</text>
    <text x="1058" y="38" fill="#4d6a85">EOF</text>
    <rect x="1094" y="28" width="7" height="12" fill="#66c0f4">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="12" y="12" width="1176" height="136" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.2" opacity="0.7"/>
</svg>
