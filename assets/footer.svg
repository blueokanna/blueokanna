<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="footer">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0b1727"/>
      <stop offset="1" stop-color="#0a1424"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbe9ff"/>
      <stop offset="0.6" stop-color="#7ea6e0"/>
      <stop offset="1" stop-color="#a9c8f2"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3555" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#a9c8f2" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1e3555" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dbe9ff"/>
      <stop offset="1" stop-color="#a9c8f2"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9cc0f0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9cc0f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#1e3555" stroke-width="1" stroke-opacity="0.36"/>
    </pattern>
    <clipPath id="frame">
      <rect x="12" y="12" width="1176" height="136" rx="14"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="136" rx="14" fill="url(#panel)"/>
  <g clip-path="url(#frame)">
    <rect x="-30" y="-30" width="1260" height="220" fill="url(#grid)" opacity="0.26">
      <animateTransform attributeName="transform" type="translate" values="0 0;30 0" dur="12s" repeatCount="indefinite"/>
    </rect>
    <circle cx="600" cy="150" r="230" fill="url(#bloom)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="9s" repeatCount="indefinite"/>
    </circle>
    <g fill="none" stroke="url(#wave)" stroke-width="1.3" opacity="0.5">
      <path d="M0 126 Q75 110 150 126 Q225 110 300 126 Q375 110 450 126 Q525 110 600 126 Q675 110 750 126 Q825 110 900 126 Q975 110 1050 126 Q1125 110 1200 126 Q1275 110 1350 126 Q1425 110 1500 126 Q1575 110 1650 126 Q1725 110 1800 126 Q1875 110 1950 126 Q2025 110 2100 126 Q2175 110 2250 126 Q2325 110 2400 126 Q2475 110 2550 126">
        <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="17s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="none" stroke="url(#wave)" stroke-width="1.7" opacity="0.8">
      <path d="M0 142 Q75 126 150 142 Q225 126 300 142 Q375 126 450 142 Q525 126 600 142 Q675 126 750 142 Q825 126 900 142 Q975 126 1050 142 Q1125 126 1200 142 Q1275 126 1350 142 Q1425 126 1500 142 Q1575 126 1650 142 Q1725 126 1800 142 Q1875 126 1950 142 Q2025 126 2100 142 Q2175 126 2250 142 Q2325 126 2400 142 Q2475 126 2550 142">
        <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="none" stroke="url(#wave)" stroke-width="2.2" opacity="0.9">
      <path d="M0 154 Q75 140 150 154 Q225 140 300 154 Q375 140 450 154 Q525 140 600 154 Q675 140 750 154 Q825 140 900 154 Q975 140 1050 154 Q1125 140 1200 154 Q1275 140 1350 154 Q1425 140 1500 154 Q1575 140 1650 154 Q1725 140 1800 154 Q1875 140 1950 154 Q2025 140 2100 154 Q2175 140 2250 154 Q2325 140 2400 154 Q2475 140 2550 154">
        <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <rect x="12" y="0" width="1176" height="2" fill="#a9c8f2" opacity="0.25">
      <animate attributeName="y" values="12;146;12" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="mono" text-anchor="middle">
    <text x="600" y="58" font-size="18" font-weight="700" letter-spacing="2" fill="url(#title)">© 2026 BLUEOKANNA</text>
    <text x="600" y="82" font-size="12" letter-spacing="1" fill="#7e97b8">backend engineer · systems &amp; performance · open source</text>
    <text x="600" y="103" font-size="11" letter-spacing="3" fill="#a9c8f2" fill-opacity="0.85">BLUEOKANNA EDITION · 2026</text>
  </g>

  <g class="mono" font-size="11">
    <text x="88" y="38" fill="#4a6285">// end of transmission</text>
    <text x="1058" y="38" fill="#4a6285">EOF · 2026-10-05</text>
    <rect x="1094" y="28" width="7" height="12" fill="#dbe9ff">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="12" y="12" width="1176" height="136" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.2" opacity="0.7"/>
</svg>
