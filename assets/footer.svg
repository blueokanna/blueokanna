<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="0.5" stop-color="#091120"/>
      <stop offset="1" stop-color="#0c0918"/>
    </linearGradient>
    <linearGradient id="fedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="fwave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="ftext" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="0.6" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="fhalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#1c3a5e" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>
    <clipPath id="fframe">
      <rect x="12" y="12" width="1176" height="146" rx="18"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="146" rx="18" fill="url(#fbg)"/>
  <g clip-path="url(#fframe)">
    <rect x="-30" y="-30" width="1260" height="210" fill="url(#fgrid)" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0;30 0" dur="10s" repeatCount="indefinite"/>
    </rect>
    <circle cx="600" cy="150" r="230" fill="url(#fhalo)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="8s" repeatCount="indefinite"/>
    </circle>

    <g fill="none" stroke="url(#fwave)" stroke-width="1.4" opacity="0.55">
      <path d="M0 130 Q75 112 150 130 T300 130 T450 130 T600 130 T750 130 T900 130 T1050 130 T1200 130 T1350 130 T1500 130 T1650 130 T1800 130 T1950 130 T2100 130 T2250 130 T2400 130">
        <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="16s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="none" stroke="url(#fwave)" stroke-width="1.8" opacity="0.85">
      <path d="M0 148 Q75 130 150 148 T300 148 T450 148 T600 148 T750 148 T900 148 T1050 148 T1200 148 T1350 148 T1500 148 T1650 148 T1800 148 T1950 148 T2100 148 T2250 148 T2400 148">
        <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="none" stroke="url(#fwave)" stroke-width="2.4" opacity="0.9">
      <path d="M0 160 Q75 144 150 160 T300 160 T450 160 T600 160 T750 160 T900 160 T1050 160 T1200 160 T1350 160 T1500 160 T1650 160 T1800 160 T1950 160 T2100 160 T2250 160 T2400 160">
        <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <rect x="12" y="0" width="1176" height="2" fill="#22d3ee" opacity="0.3">
      <animate attributeName="y" values="12;158;12" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="mono" text-anchor="middle">
    <text x="600" y="58" font-size="18" font-weight="700" letter-spacing="2" fill="url(#ftext)">© 2026 BLUEOKANNA</text>
    <text x="600" y="82" font-size="12" fill="#7d8ea6" letter-spacing="1">backend engineer · rust · java · flutter</text>
    <text x="600" y="103" font-size="11" fill="#f9a8d4" fill-opacity="0.7" letter-spacing="3">HANAYOME EDITION · SPRING</text>
  </g>

  <g class="mono" font-size="11">
    <text x="88" y="38" fill="#3f5876">// end of transmission</text>
    <text x="1058" y="38" fill="#3f5876">EOF</text>
    <rect x="1094" y="28" width="7" height="12" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="12" y="12" width="1176" height="146" rx="18" fill="none" stroke="url(#fedge)" stroke-width="1.5" opacity="0.85"/>
  <g stroke="url(#fedge)" stroke-width="2" fill="none" opacity="0.9">
    <path d="M30 70 V30 Q30 26 34 26 H74"/>
    <path d="M1126 26 H1166 Q1170 26 1170 30 V70"/>
    <path d="M30 100 V140 Q30 144 34 144 H74"/>
    <path d="M1126 144 H1166 Q1170 144 1170 140 V100"/>
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
