        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.4;0.94;1" dur="14s" repeatCount="indefinite"/>
      </text>
      <text x="62" y="350" fill="#c9d1d9" opacity="0">
