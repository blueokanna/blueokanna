    <text x="60" y="186" font-size="58" font-weight="700" letter-spacing="3" fill="#f0abfc" fill-opacity="0.35">
      BLUEOKANNA
      <animateTransform attributeName="transform" type="translate" values="0 0;-2 0;0 0;0 0;0 0" keyTimes="0;0.04;0.08;0.12;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="186" font-size="58" font-weight="700" letter-spacing="3" fill="url(#name)">BLUEOKANNA</text>

    <text x="62" y="222" font-size="16" fill="#7dd3fc">backend engineer · rust · java · flutter</text>
    <path d="M60 242 H520" stroke="url(#rule)" stroke-width="2" stroke-linecap="round"/>

    <g font-size="15">
      <text x="62" y="272" fill="#22d3ee">$ whoami</text>
      <text x="62" y="298" fill="#c9d1d9" opacity="0">
        &gt; blueokanna · systems &amp; performance
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.2;0.94;1" dur="14s" repeatCount="indefinite"/>
      </text>
      <text x="62" y="324" fill="#22d3ee" opacity="0">
