# Profile metrics.
#
# lowlighter/metrics reads account-wide data (user, organisations, cross-repo
# activity) that a repository-scoped GITHUB_TOKEN cannot reach, so it needs a
# personal access token stored as the METRICS_TOKEN secret:
#
#   1. https://github.com/settings/tokens -> "Generate new token (classic)"
#      scopes: public_repo, read:user
#   2. Repository -> Settings -> Secrets and variables -> Actions ->
#      "New repository secret" named METRICS_TOKEN
#   3. Pick an expiry you will actually rotate. PATs expire silently and the
#      render then dies with "Bad credentials" halfway through the run.
#
# Every run verifies the token before rendering: when it is missing or expired
# the job stays green, keeps the last committed assets/metrics.svg and writes a
# warning plus the exact fix into the run summary instead of failing mid-render.

name: metrics

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "assets/metrics.svg"
  workflow_dispatch:
  repository_dispatch:
    types:
      - metrics_update

permissions:
  contents: write

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-metrics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify METRICS_TOKEN
        id: auth
        shell: bash
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -uo pipefail

          if [[ -z "${METRICS_TOKEN:-}" ]]; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
            echo "::warning title=metrics skipped::METRICS_TOKEN is not set, see the run summary for the fix."
            exit 0
          fi

          tmp="$(mktemp -d)"
          status="$(curl -sS --max-time 20 -o "$tmp/body" -D "$tmp/headers" -w '%{http_code}' \
            -H "Authorization: token ${METRICS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user || echo 000)"

          scopes="$(tr -d '\r' < "$tmp/headers" | awk -F': ' 'tolower($1)=="x-oauth-scopes"{print $2}')"

          if [[ "$status" == "200" ]]; then
            echo "state=valid" >> "$GITHUB_OUTPUT"
            echo "scopes=${scopes:-none (fine-grained token)}" >> "$GITHUB_OUTPUT"
          else
            echo "state=invalid" >> "$GITHUB_OUTPUT"
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "::warning title=metrics skipped::METRICS_TOKEN was rejected with HTTP $status, see the run summary for the fix."
          fi

      - name: Explain how to fix the token
        if: steps.auth.outputs.state != 'valid'
        shell: bash
        env:
          STATE: ${{ steps.auth.outputs.state }}
          STATUS: ${{ steps.auth.outputs.status }}
        run: |
          set -uo pipefail
          {
            if [[ "$STATE" == "missing" ]]; then
              echo "### metrics render skipped — \`METRICS_TOKEN\` is not set"
              echo
              echo "The last committed \`assets/metrics.svg\` is kept, so the profile still renders."
            else
              echo "### metrics render skipped — \`METRICS_TOKEN\` is no longer accepted"
              echo
              echo "The verify step answered \`HTTP ${STATUS:-unknown}\` (expected \`200\`). The token has expired, was revoked or was replaced — this is the \`Bad credentials\` failure."
            fi
            echo
            echo "**Fix**"
            echo
            echo "1. Open https://github.com/settings/tokens and generate a new **classic** token."
            echo "2. Grant the \`public_repo\` and \`read:user\` scopes."
            echo "3. Update the secret: repository **Settings → Secrets and variables → Actions → \`METRICS_TOKEN\`**."
            echo "4. Re-run this workflow: **Actions → metrics → Run workflow**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: steps.auth.outputs.state == 'valid'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate metrics
        if: steps.auth.outputs.state == 'valid'
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          output_action: commit

          user: blueokanna
          template: classic
          base: header, community, repositories
          base_indepth: yes

          repositories_affiliations: owner
          repositories_forks: no
          repositories: 200
          repositories_batch: 50

          config_timezone: Asia/Shanghai
          config_display: large

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 5
          plugin_languages_other: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Bump README cache (metrics)
        if: steps.auth.outputs.state == 'valid'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const runId = process.env.GITHUB_RUN_ID;
            const path = 'README.md';

            const current = await github.rest.repos.getContent({ owner, repo, path });
            const decoded = Buffer.from(current.data.content, 'base64').toString('utf8');

            const updated = decoded.replace(
              /assets\/metrics\.svg(?:\?v=\d+)?/g,
              `assets/metrics.svg?v=${runId}`,
            );

            if (updated === decoded) {
              core.info('README already up to date; skipping.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `chore: refresh README cache (${runId})`,
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha: current.data.sha,
            });
